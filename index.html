<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装修管理平台 · 悦望名邸</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#faf9f7;--bg2:#f2f0eb;--bg3:#e8e5de;--card:#fff;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --green:#2d6a1f;--green-bg:#eaf3de;--green-mid:#639922;
  --blue:#1452a0;--blue-bg:#e4eef9;
  --amber:#7a4500;--amber-bg:#faeeda;
  --red:#991f1f;--red-bg:#fce8e8;
  --purple:#4a38a0;--purple-bg:#eeedfe;
  --teal:#0e6b52;--teal-bg:#e1f5ee;
  --gray:#5a5a5a;--gray-bg:#f1efe8;
  --r:8px;--rl:14px;
  --shadow:0 1px 4px rgba(0,0,0,0.07),0 0 0 0.5px rgba(0,0,0,0.06);
}
body{font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}

/* ── Top nav ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;}
.topbar-inner{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:0;}
.app-title{font-size:15px;font-weight:700;padding:16px 0;margin-right:32px;white-space:nowrap;}
.app-sub{font-size:11px;color:var(--text3);font-weight:400;display:block;}
.main-tabs{display:flex;gap:0;}
.main-tab{padding:18px 18px;font-size:13px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;}
.main-tab:hover{color:var(--text);}
.main-tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:500;}

/* ── Content ── */
.content{max-width:1060px;margin:0 auto;padding:24px;}
.page{display:none;}.page.active{display:block;}

/* ── Metrics row ── */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.metric{background:var(--card);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--shadow);}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:5px;}
.metric-value{font-size:20px;font-weight:600;}
.mv-ok{color:var(--green);}.mv-bad{color:var(--red);}.mv-warn{color:var(--amber);}

/* ── Progress bar ── */
.pbar-wrap{background:var(--bg3);border-radius:4px;height:7px;overflow:hidden;margin:6px 0;}
.pbar{height:100%;border-radius:4px;transition:width .4s;}

/* ── Card ── */
.card{background:var(--card);border-radius:var(--rl);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.card-pad{padding:16px 20px;}

/* ── Table ── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:11px;font-weight:500;color:var(--text3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}

/* ── Badges ── */
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap;}
.bd{background:var(--green-bg);color:var(--green);}
.bp{background:var(--blue-bg);color:var(--blue);}
.bn{background:var(--gray-bg);color:var(--gray);}
.bo{background:var(--red-bg);color:var(--red);}
.bw{background:var(--amber-bg);color:var(--amber);}
.bar{background:var(--green-bg);color:var(--green);}
.btr{background:var(--amber-bg);color:var(--amber);}
.bor{background:var(--blue-bg);color:var(--blue);}
.bno{background:var(--gray-bg);color:var(--gray);}

/* ── Add row ── */
.add-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 0;border-top:1px solid var(--border);margin-top:10px;}
.add-row input,.add-row select,.ar-inp,.ar-sel{font-size:13px;padding:6px 9px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);height:34px;outline:none;}
.add-row input:focus,.add-row select:focus,.ar-inp:focus{border-color:var(--green);}
.fn{flex:2;min-width:80px;}
.btn{height:34px;padding:0 14px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap;transition:background .12s;}
.btn:hover{background:var(--bg2);}
.btn-pri{background:var(--text);color:var(--card);border-color:var(--text);}
.btn-pri:hover{opacity:.85;}
.btn-sm{height:28px;padding:0 9px;font-size:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text2);cursor:pointer;}
.btn-sm:hover{background:var(--bg3);color:var(--text);}
.del-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;}
.del-btn:hover{background:var(--red-bg);color:var(--red);}

/* ── Alert ── */
.alert{border-radius:var(--r);padding:10px 14px;margin-bottom:10px;font-size:13px;}
.alert-d{background:var(--red-bg);color:var(--red);}
.alert-w{background:var(--amber-bg);color:var(--amber);}

/* ── Photo modal ── */
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.mask.open{display:flex;}
.modal{background:var(--card);border-radius:var(--rl);padding:20px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-title{font-size:15px;font-weight:600;}
.modal-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px;margin-bottom:12px;}
.pthumb-wrap{position:relative;}
.pthumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r);border:1px solid var(--border);cursor:pointer;}
.pdel{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.padd{width:100%;aspect-ratio:1;border-radius:var(--r);border:1.5px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2);color:var(--text3);font-size:22px;gap:3px;}
.padd:hover{background:var(--bg3);}
.padd span{font-size:11px;}

/* ── Log ── */
.log-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.log-item:last-child{border-bottom:none;}
.log-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.av-me{background:var(--green-bg);color:var(--green);}
.av-dad{background:var(--blue-bg);color:var(--blue);}
.av-mom{background:#fbeaf0;color:#993556;}
.log-body{flex:1;min-width:0;}
.log-text{font-size:13px;line-height:1.6;word-break:break-all;}
.log-meta{font-size:11px;color:var(--text3);margin-top:3px;}
.log-photos{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.lph{width:50px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;}
textarea{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);resize:vertical;min-height:60px;font-family:inherit;outline:none;}
textarea:focus{border-color:var(--green);}
.msel{display:flex;gap:6px;}
.mbtn{padding:4px 13px;font-size:12px;border:1px solid var(--border2);border-radius:999px;background:var(--card);color:var(--text2);cursor:pointer;}
.mbtn.sel{background:var(--text);color:var(--card);border-color:var(--text);}

/* ── Export ── */
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.ecard{border:1px solid var(--border);border-radius:var(--rl);padding:16px;cursor:pointer;transition:background .12s;}
.ecard:hover{background:var(--bg2);}
.eicon{font-size:24px;margin-bottom:6px;}
.etitle{font-size:14px;font-weight:600;margin-bottom:3px;}
.edesc{font-size:12px;color:var(--text2);line-height:1.5;}

/* ── Lightbox ── */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;cursor:zoom-out;}
.lb.open{display:flex;}
.lb img{max-width:92vw;max-height:88vh;border-radius:var(--r);}

/* ── GUIDE page ── */
.guide-layout{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start;}
.guide-nav{position:sticky;top:72px;}
.gn-phase{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding:8px 10px 3px;}
.gn-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;text-decoration:none;}
.gn-item:hover{background:var(--bg2);color:var(--text);}
.gn-item.active-nav{background:var(--green-bg);color:var(--green);font-weight:500;}
.gn-num{width:20px;height:20px;border-radius:50%;background:var(--bg3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gn-item.active-nav .gn-num{background:var(--green);color:#fff;}

/* Phase sections */
.phase-sec{margin-bottom:36px;}
.phase-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--border);}
.ph-icon{width:42px;height:42px;border-radius:var(--rl);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ph-title{font-size:18px;font-weight:700;}
.ph-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.ph-badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500;margin-left:auto;white-space:nowrap;}

/* Step cards in guide */
.step-card{background:var(--card);border-radius:var(--rl);box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--border);}
.step-hdr{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;}
.step-hdr:hover{background:var(--bg);}
.step-num-badge{width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-title-col{flex:1;min-width:0;}
.step-title{font-size:14px;font-weight:600;}
.step-tagline{font-size:12px;color:var(--text3);margin-top:2px;}
.step-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:500;}
.t-time{background:var(--blue-bg);color:var(--blue);}
.t-warn{background:var(--red-bg);color:var(--red);}
.t-tip{background:var(--teal-bg);color:var(--teal);}
.t-money{background:var(--amber-bg);color:var(--amber);}
.t-diy{background:var(--green-bg);color:var(--green);}
.step-toggle{color:var(--text3);font-size:16px;margin-top:2px;transition:transform .2s;flex-shrink:0;}
.step-toggle.open{transform:rotate(180deg);}
.step-body-wrap{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
.step-body-wrap.open{display:block;}

/* Step body blocks */
.blk{margin-top:14px;}
.blk-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;}
.tip-box{background:var(--teal-bg);border-radius:var(--r);padding:10px 13px;font-size:13px;color:var(--teal);line-height:1.7;}
.warn-box{background:var(--red-bg);border-radius:var(--r);padding:10px 13px;font-size:13px;color:var(--red);line-height:1.7;}
.info-box{background:var(--blue-bg);border-radius:var(--r);padding:10px 13px;font-size:13px;color:var(--blue);line-height:1.7;}
.amb-box{background:var(--amber-bg);border-radius:var(--r);padding:10px 13px;font-size:13px;color:var(--amber);line-height:1.7;}
.kv-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.kv-tbl td{padding:6px 9px;border-bottom:1px solid var(--border);vertical-align:top;}
.kv-tbl td:first-child{font-weight:500;color:var(--text2);width:36%;white-space:nowrap;}
.kv-tbl tr:last-child td{border-bottom:none;}

/* Editable checklist */
.ecl{list-style:none;}
.ecl-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;group:true;}
.ecl-item:last-child{border-bottom:none;}
.ecl-check{width:16px;height:16px;border:1px solid var(--border2);border-radius:3px;flex-shrink:0;margin-top:2px;cursor:pointer;appearance:none;-webkit-appearance:none;position:relative;}
.ecl-check:checked{background:var(--green);border-color:var(--green);}
.ecl-check:checked::after{content:'✓';position:absolute;color:#fff;font-size:10px;font-weight:700;top:-1px;left:1px;}
.ecl-text{flex:1;outline:none;background:transparent;border:none;font-size:13px;font-family:inherit;color:var(--text);line-height:1.6;cursor:text;resize:none;padding:0;}
.ecl-text:focus{background:var(--bg2);border-radius:4px;padding:1px 4px;}
.ecl-del{background:none;border:none;color:transparent;cursor:pointer;font-size:13px;padding:0 3px;border-radius:3px;flex-shrink:0;transition:color .1s;}
.ecl-item:hover .ecl-del{color:var(--text3);}
.ecl-del:hover{color:var(--red)!important;background:var(--red-bg);}
.add-item-row{display:flex;gap:6px;margin-top:8px;align-items:center;}
.add-item-inp{flex:1;font-size:13px;padding:5px 9px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);outline:none;}
.add-item-inp:focus{border-color:var(--green);}

/* Phase colors */
.ph1 .ph-icon{background:var(--blue-bg);}
.ph1 .ph-badge{background:var(--blue-bg);color:var(--blue);}
.ph1 .step-num-badge{background:var(--blue-bg);color:var(--blue);}
.ph2 .ph-icon{background:var(--amber-bg);}
.ph2 .ph-badge{background:var(--amber-bg);color:var(--amber);}
.ph2 .step-num-badge{background:var(--amber-bg);color:var(--amber);}
.ph3 .ph-icon{background:var(--red-bg);}
.ph3 .ph-badge{background:var(--red-bg);color:var(--red);}
.ph3 .step-num-badge{background:var(--red-bg);color:var(--red);}
.ph4 .ph-icon{background:var(--teal-bg);}
.ph4 .ph-badge{background:var(--teal-bg);color:var(--teal);}
.ph4 .step-num-badge{background:var(--teal-bg);color:var(--teal);}
.ph5 .ph-icon{background:var(--purple-bg);}
.ph5 .ph-badge{background:var(--purple-bg);color:var(--purple);}
.ph5 .step-num-badge{background:var(--purple-bg);color:var(--purple);}
.ph6 .ph-icon{background:var(--green-bg);}
.ph6 .ph-badge{background:var(--green-bg);color:var(--green);}
.ph6 .step-num-badge{background:var(--green-bg);color:var(--green);}

.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tbtn{padding:6px 13px;font-size:12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);color:var(--text2);cursor:pointer;}
.tbtn:hover{background:var(--bg2);}

.success-msg{color:var(--green);font-size:13px;margin-top:10px;}

@media(max-width:680px){
  .guide-layout{grid-template-columns:1fr;}
  .guide-nav{position:static;display:flex;flex-wrap:wrap;gap:4px;}
  .metrics{grid-template-columns:1fr 1fr;}
  .egrid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="app-title">悦望名邸装修管理<span class="app-sub">五层排屋 · 162㎡ · 半包</span></div>
    <div class="main-tabs">
      <button class="main-tab active" onclick="mainSw('budget')">预算</button>
      <button class="main-tab" onclick="mainSw('payment')">付款提醒</button>
      <button class="main-tab" onclick="mainSw('progress')">施工进度</button>
      <button class="main-tab" onclick="mainSw('materials')">材料采购</button>
      <button class="main-tab" onclick="mainSw('log')">沟通记录</button>
      <button class="main-tab" onclick="mainSw('guide')">装修流程</button>
      <button class="main-tab" onclick="mainSw('export')">导出</button>
    </div>
  </div>
</div>

<div class="content">

<!-- ══ 预算 ══ -->
<div id="page-budget" class="page active">
  <div class="metrics" id="BM"></div>
  <div class="pbar-wrap"><div class="pbar" id="BPBAR"></div></div>
  <p style="font-size:12px;color:var(--text3);margin-bottom:14px" id="BPTXT"></p>
  <div class="card card-pad">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:28%">分类</th><th>预算</th><th>已付</th><th>差额</th><th>状态</th><th style="width:36px"></th></tr></thead>
        <tbody id="BTBODY"></tbody>
      </table>
    </div>
    <div class="add-row">
      <input class="fn" id="BN" placeholder="分类名称"/>
      <input id="BB" placeholder="预算 ¥" type="number" style="width:100px"/>
      <input id="BP" placeholder="已付 ¥" type="number" style="width:100px"/>
      <button class="btn" onclick="addB()">+ 添加</button>
    </div>
  </div>
</div>

<!-- ══ 付款提醒 ══ -->
<div id="page-payment" class="page">
  <div id="PALERTS"></div>
  <div class="card card-pad">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:22%">付款事项</th><th>金额</th><th>截止日期</th><th>备注</th><th>状态</th><th style="width:110px"></th></tr></thead>
        <tbody id="PTBODY"></tbody>
      </table>
    </div>
    <div class="add-row">
      <input class="fn" id="PN" placeholder="付款事项"/>
      <input id="PA" placeholder="金额 ¥" type="number" style="width:90px"/>
      <input id="PD" type="date" style="width:138px"/>
      <input id="PR" placeholder="备注" style="width:110px"/>
      <button class="btn" onclick="addP()">+ 添加</button>
    </div>
  </div>
</div>

<!-- ══ 施工进度 ══ -->
<div id="page-progress" class="page">
  <div class="metrics" id="PGM"></div>
  <div class="card card-pad">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:22%">施工项目</th><th>负责方</th><th>计划完成</th><th>状态</th><th>照片</th><th style="width:36px"></th></tr></thead>
        <tbody id="PGTBODY"></tbody>
      </table>
    </div>
    <div class="add-row">
      <input class="fn" id="PGN" placeholder="施工项目"/>
      <input id="PGW" placeholder="负责方" style="width:90px"/>
      <input id="PGD" type="date" style="width:138px"/>
      <select id="PGS" style="width:90px"><option value="pending">待开始</option><option value="progress">进行中</option><option value="done">已完成</option></select>
      <button class="btn" onclick="addPG()">+ 添加</button>
    </div>
  </div>
</div>

<!-- ══ 材料采购 ══ -->
<div id="page-materials" class="page">
  <div class="metrics" id="MM"></div>
  <div class="card card-pad">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th style="width:16%">材料</th><th>品牌/规格</th><th>数量</th><th>金额</th><th>到货</th><th>照片</th><th style="width:36px"></th></tr></thead>
        <tbody id="MTBODY"></tbody>
      </table>
    </div>
    <div class="add-row">
      <input class="fn" id="MN" placeholder="材料名称"/>
      <input id="MS" placeholder="品牌/规格" style="width:100px"/>
      <input id="MQ" placeholder="数量" style="width:58px"/>
      <input id="MP" placeholder="金额¥" type="number" style="width:80px"/>
      <select id="MST" style="width:90px"><option value="notyet">未下单</option><option value="ordered">已下单</option><option value="transit">运输中</option><option value="arrived">已到货</option></select>
      <button class="btn" onclick="addM()">+ 添加</button>
    </div>
  </div>
</div>

<!-- ══ 沟通记录 ══ -->
<div id="page-log" class="page">
  <div class="card card-pad">
    <div id="LOGLIST"></div>
    <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:14px">

// ─── Helpers ─────────────────────────────────────────────────────────────────
const today=new Date();
function days(d){return Math.ceil((new Date(d)-today)/86400000);}
function fmt(n){return '¥'+Math.round(n).toLocaleString();}
function tod(){return today.toISOString().slice(0,10);}
function uid(){return 'i'+(NID++);}

// ─── Main nav ─────────────────────────────────────────────────────────────────
const PAGES=['budget','payment','progress','materials','log','guide','export'];
function mainSw(name){
  document.querySelectorAll('.main-tab').forEach((t,i)=>t.classList.toggle('active',PAGES[i]===name));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
}

// ─── Budget ──────────────────────────────────────────────────────────────────
function rBudget(){
  const tb=S.budget.reduce((s,r)=>s+r.budget,0);
  const tp=S.budget.reduce((s,r)=>s+r.paid,0);
  const rem=tb-tp,pct=tb>0?Math.round(tp/tb*100):0;
  const ov=S.budget.filter(r=>r.paid>r.budget).length;
  document.getElementById('BM').innerHTML=`
    <div class="metric"><div class="metric-label">总预算</div><div class="metric-value">${fmt(tb)}</div></div>
    <div class="metric"><div class="metric-label">已支出</div><div class="metric-value ${tp>tb?'mv-bad':''}">${fmt(tp)}</div></div>
    <div class="metric"><div class="metric-label">剩余预算</div><div class="metric-value ${rem<0?'mv-bad':'mv-ok'}">${fmt(rem)}</div></div>`;
  const bar=document.getElementById('BPBAR');
  bar.style.width=Math.min(pct,100)+'%';
  bar.style.background=pct>100?'var(--red)':'var(--blue)';
  document.getElementById('BPTXT').textContent=`已用 ${pct}% · ${ov>0?ov+' 项超支':'无超支项目'}`;
  document.getElementById('BTBODY').innerHTML=S.budget.map(r=>{
    const d=r.budget-r.paid,o=r.paid>r.budget;
    const b=o?'<span class="badge bo">超支</span>':r.paid>=r.budget?'<span class="badge bd">完成</span>':r.paid>0?'<span class="badge bp">进行中</span>':'<span class="badge bn">未开始</span>';
    return `<tr><td>${r.name}</td><td>${fmt(r.budget)}</td><td>${fmt(r.paid)}</td><td style="color:${o?'var(--red)':'var(--green)'}">${o?'-':'+'}${fmt(Math.abs(d))}</td><td>${b}</td><td><button class="del-btn" onclick="del('budget',${r.id})">×</button></td></tr>`;
  }).join('');
}
function addB(){
  const n=document.getElementById('BN').value.trim();if(!n)return;
  S.budget.push({id:NID++,name:n,budget:parseFloat(document.getElementById('BB').value)||0,paid:parseFloat(document.getElementById('BP').value)||0});
  ['BN','BB','BP'].forEach(id=>document.getElementById(id).value='');
  rBudget();
}

// ─── Payments ────────────────────────────────────────────────────────────────
function rPayment(){
  const al=[];
  S.payments.filter(r=>!r.paid).forEach(r=>{
    const d=days(r.dueDate);
    if(d<0) al.push(`<div class="alert alert-d">逾期未付：${r.name} ${fmt(r.amount)}（已逾期 ${Math.abs(d)} 天）</div>`);
    else if(d<=7) al.push(`<div class="alert alert-w">即将到期：${r.name} ${fmt(r.amount)}（还剩 ${d} 天 · ${r.dueDate}）</div>`);
  });
  document.getElementById('PALERTS').innerHTML=al.join('');
  document.getElementById('PTBODY').innerHTML=S.payments.map(r=>{
    const d=days(r.dueDate);
    const b=r.paid?'<span class="badge bd">已付</span>':d<0?'<span class="badge bo">已逾期</span>':d<=7?'<span class="badge bw">即将到期</span>':'<span class="badge bn">待付</span>';
    const ck=r.paid?'':` <button class="btn-sm" onclick="markPaid(${r.id})">✓ 已付</button>`;
    return `<tr><td>${r.name}</td><td>${fmt(r.amount)}</td><td style="color:${!r.paid&&d<0?'var(--red)':!r.paid&&d<=7?'var(--amber)':'inherit'}">${r.dueDate}</td><td style="color:var(--text2)">${r.note||''}</td><td>${b}</td><td style="display:flex;gap:4px;align-items:center">${ck}<button class="del-btn" onclick="del('payments',${r.id})">×</button></td></tr>`;
  }).join('');
}
function markPaid(id){const r=S.payments.find(x=>x.id===id);if(r)r.paid=true;rPayment();}
function addP(){
  const n=document.getElementById('PN').value.trim();if(!n)return;
  S.payments.push({id:NID++,name:n,amount:parseFloat(document.getElementById('PA').value)||0,dueDate:document.getElementById('PD').value||tod(),note:document.getElementById('PR').value,paid:false});
  ['PN','PA','PD','PR'].forEach(id=>document.getElementById(id).value='');
  rPayment();
}

// ─── Progress ────────────────────────────────────────────────────────────────
function rProgress(){
  const done=S.progress.filter(r=>r.status==='done').length;
  const tot=S.progress.length,pct=tot>0?Math.round(done/tot*100):0;
  document.getElementById('PGM').innerHTML=`<div class="metric"><div class="metric-label">总项目</div><div class="metric-value">${tot}</div></div><div class="metric"><div class="metric-label">已完成</div><div class="metric-value mv-ok">${done}</div></div><div class="metric"><div class="metric-label">完成率</div><div class="metric-value">${pct}%</div></div>`;
  const sl={done:'已完成',progress:'进行中',pending:'待开始'},bc={done:'bd',progress:'bp',pending:'bn'};
  document.getElementById('PGTBODY').innerHTML=S.progress.map(r=>`<tr><td>${r.name}</td><td style="color:var(--text2)">${r.worker}</td><td style="color:var(--text2)">${r.date}</td><td><span class="badge ${bc[r.status]}">${sl[r.status]}</span></td><td><button class="btn-sm" onclick="openPhotos('progress',${r.id},'${r.name}')">照片${r.photos.length?'('+r.photos.length+')':''}</button></td><td><button class="del-btn" onclick="del('progress',${r.id})">×</button></td></tr>`).join('');
}
function addPG(){
  const n=document.getElementById('PGN').value.trim();if(!n)return;
  S.progress.push({id:NID++,name:n,worker:document.getElementById('PGW').value||'-',date:document.getElementById('PGD').value||'-',status:document.getElementById('PGS').value,photos:[]});
  ['PGN','PGW','PGD'].forEach(id=>document.getElementById(id).value='');
  rProgress();
}

// ─── Materials ───────────────────────────────────────────────────────────────
function rMaterials(){
  const tot=S.materials.length,arr=S.materials.filter(r=>r.status==='arrived').length;
  const amt=S.materials.reduce((s,r)=>s+(r.price||0),0);
  document.getElementById('MM').innerHTML=`<div class="metric"><div class="metric-label">采购项</div><div class="metric-value">${tot} 项</div></div><div class="metric"><div class="metric-label">已到货</div><div class="metric-value mv-ok">${arr} 项</div></div><div class="metric"><div class="metric-label">采购总额</div><div class="metric-value">${fmt(amt)}</div></div>`;
  const sl={arrived:'已到货',transit:'运输中',ordered:'已下单',notyet:'未下单'},bc={arrived:'bar',transit:'btr',ordered:'bor',notyet:'bno'};
  document.getElementById('MTBODY').innerHTML=S.materials.map(r=>`<tr><td>${r.name}</td><td style="color:var(--text2)">${r.spec}</td><td style="color:var(--text2)">${r.qty}</td><td>${r.price?fmt(r.price):'-'}</td><td><span class="badge ${bc[r.status]}">${sl[r.status]}</span></td><td><button class="btn-sm" onclick="openPhotos('materials',${r.id},'${r.name}')">照片${r.photos.length?'('+r.photos.length+')':''}</button></td><td><button class="del-btn" onclick="del('materials',${r.id})">×</button></td></tr>`).join('');
}
function addM(){
  const n=document.getElementById('MN').value.trim();if(!n)return;
  S.materials.push({id:NID++,name:n,spec:document.getElementById('MS').value||'-',qty:document.getElementById('MQ').value||'-',price:parseFloat(document.getElementById('MP').value)||0,status:document.getElementById('MST').value,photos:[]});
  ['MN','MS','MQ','MP'].forEach(id=>document.getElementById(id).value='');
  rMaterials();
}

// ─── Logs ────────────────────────────────────────────────────────────────────
function rLogs(){
  const ac={我:'av-me',爸:'av-dad',妈:'av-mom'};
  document.getElementById('LOGLIST').innerHTML=[...S.logs].reverse().map(r=>`
    <div class="log-item">
      <div class="log-av ${ac[r.who]||'av-me'}">${r.who}</div>
      <div class="log-body">
        <div class="log-text">${r.text}</div>
        ${r.photos&&r.photos.length?`<div class="log-photos">${r.photos.map(p=>`<img src="${p}" class="lph" onclick="viewImg('${p}')"/>`).join('')}</div>`:''}
        <div class="log-meta">${r.who} · ${r.date}</div>
      </div>
      <button class="del-btn" onclick="del('logs',${r.id})">×</button>
    </div>`).join('');
}
function previewLogPh(e){
  const files=Array.from(e.target.files);
  const prev=document.getElementById('LOGPHPREV');prev.innerHTML='';logPhs=[];
  files.forEach(f=>{const r=new FileReader();r.onload=ev=>{logPhs.push(ev.target.result);const img=document.createElement('img');img.src=ev.target.result;img.style.cssText='width:50px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--border)';prev.appendChild(img);document.getElementById('LOGPHC').textContent=logPhs.length+'张';};r.readAsDataURL(f);});
}
function addLog(){
  const t=document.getElementById('LOGTXT').value.trim();if(!t)return;
  S.logs.push({id:NID++,who:selWho,text:t,date:tod(),photos:[...logPhs]});
  document.getElementById('LOGTXT').value='';document.getElementById('LOGPHPREV').innerHTML='';document.getElementById('LOGPHC').textContent='';document.getElementById('LOGPHI').value='';logPhs=[];
  rLogs();
}
function selM(btn){document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');selWho=btn.dataset.who;}

// ─── Photos ──────────────────────────────────────────────────────────────────
function openPhotos(type,id,name){
  CUR={type,id};
  document.getElementById('PH-TITLE').textContent=name+' — 照片备注';
  renderPhGrid();
  document.getElementById('PH-MASK').classList.add('open');
}
function renderPhGrid(){
  if(!CUR)return;
  const rec=S[CUR.type].find(r=>r.id===CUR.id);
  const grid=document.getElementById('PH-GRID');
  grid.innerHTML=(rec.photos||[]).map((p,i)=>`<div class="pthumb-wrap"><img src="${p}" class="pthumb" onclick="viewImg('${p}')"/><button class="pdel" onclick="delPhoto(${i})">×</button></div>`).join('');
  const add=document.createElement('div');add.className='padd';add.innerHTML='<span style="font-size:24px">+</span><span>添加照片</span>';
  add.onclick=()=>document.getElementById('PH-FILE').click();
  grid.appendChild(add);
}
function delPhoto(i){const rec=S[CUR.type].find(r=>r.id===CUR.id);rec.photos.splice(i,1);renderPhGrid();rProgress();rMaterials();}
function uploadPhotos(e){
  const files=Array.from(e.target.files);
  const rec=S[CUR.type].find(r=>r.id===CUR.id);
  let done=0;
  files.forEach(f=>{const r=new FileReader();r.onload=ev=>{rec.photos.push(ev.target.result);done++;if(done===files.length){renderPhGrid();rProgress();rMaterials();}};r.readAsDataURL(f);});
  e.target.value='';
}
function closeMask(id,e){if(!e||e.target===document.getElementById(id))document.getElementById(id).classList.remove('open');}
function viewImg(src){document.getElementById('LB-IMG').src=src;document.getElementById('LB').classList.add('open');}

// ─── Generic del ─────────────────────────────────────────────────────────────
function del(type,id){S[type]=S[type].filter(r=>r.id!==id);rAll();}
function rAll(){rBudget();rPayment();rProgress();rMaterials();rLogs();}

// ─── Guide rendering ─────────────────────────────────────────────────────────
function buildGuide(){
  const nav=document.getElementById('GNAV');
  const main=document.getElementById('GUIDE_MAIN');
  nav.innerHTML='';main.innerHTML='';

  G.forEach((phase,pi)=>{
    // Nav
    const gp=document.createElement('div');
    gp.innerHTML=`<div class="gn-phase">${phase.phase}</div>`;
    phase.steps.forEach(step=>{
      const a=document.createElement('a');
      a.className='gn-item';a.href='#'+step.id;
      a.innerHTML=`<span class="gn-num">${step.num}</span>${step.title}`;
      gp.appendChild(a);
    });
    nav.appendChild(gp);

    // Phase section
    const sec=document.createElement('div');
    sec.className='phase-sec '+phase.color;
    sec.id='phase-'+pi;
    sec.innerHTML=`<div class="phase-hdr"><div class="ph-icon">${phase.icon}</div><div><div class="ph-title">${phase.phase}</div></div><div class="ph-badge">${phase.badge}</div></div>`;

    phase.steps.forEach(step=>{
      const card=document.createElement('div');
      card.className='step-card';card.id=step.id;

      const tagHtml=step.tags.map(t=>{
        const cls=t.includes('⏱')?'t-time':t.includes('⚠')||t.includes('重要')||t.includes('禁止')||t.includes('绝对')?'t-warn':t.includes('万')||t.includes('费用')||t.includes('金额')?'t-money':t.includes('自己')||t.includes('参与')?'t-diy':'t-tip';
        return `<span class="tag ${cls}">${t}</span>`;
      }).join('');

      card.innerHTML=`
        <div class="step-hdr" onclick="toggleStep(this)">
          <div class="step-num-badge">${step.num}</div>
          <div class="step-title-col">
            <div class="step-title">${step.title}</div>
            <div class="step-tagline">${step.tagline}</div>
            <div class="step-tags">${tagHtml}</div>
          </div>
          <div class="step-toggle">▾</div>
        </div>
        <div class="step-body-wrap">
          <div class="blk">
            <div class="blk-title">操作清单 <span style="font-size:10px;font-weight:400;color:var(--text3)">（点击文字可编辑，勾选可标记完成）</span></div>
            <ul class="ecl" id="ecl-${step.id}"></ul>
            <div class="add-item-row">
              <input class="add-item-inp" id="inp-${step.id}" placeholder="新增条目..."/>
              <button class="btn" onclick="addItem('${step.id}')">+ 添加</button>
            </div>
          </div>
        </div>`;
      sec.appendChild(card);
      renderEcl(step.id,step.items);
    });
    main.appendChild(sec);
  });
}

function renderEcl(stepId,items){
  const ul=document.getElementById('ecl-'+stepId);
  if(!ul)return;
  ul.innerHTML=items.map((item,idx)=>`
    <li class="ecl-item">
      <input type="checkbox" class="ecl-check" ${item.checked?'checked':''} onchange="toggleItem('${stepId}',${idx},this.checked)"/>
      <textarea class="ecl-text" rows="1" oninput="autoResize(this);updateItem('${stepId}',${idx},this.value)">${item.text}</textarea>
      <button class="ecl-del" onclick="removeItem('${stepId}',${idx})" title="删除">×</button>
    </li>`).join('');
  // auto resize all textareas
  ul.querySelectorAll('.ecl-text').forEach(t=>autoResize(t));
}

function autoResize(ta){
  ta.style.height='auto';
  ta.style.height=ta.scrollHeight+'px';
}

function findStep(stepId){
  for(const phase of G)for(const step of phase.steps)if(step.id===stepId)return step;
  return null;
}

function toggleItem(stepId,idx,checked){
  const step=findStep(stepId);
  if(step)step.items[idx].checked=checked;
}
function updateItem(stepId,idx,text){
  const step=findStep(stepId);
  if(step)step.items[idx].text=text;
}
function removeItem(stepId,idx){
  const step=findStep(stepId);
  if(!step)return;
  step.items.splice(idx,1);
  renderEcl(stepId,step.items);
}
function addItem(stepId){
  const inp=document.getElementById('inp-'+stepId);
  const text=inp.value.trim();if(!text)return;
  const step=findStep(stepId);
  if(!step)return;
  step.items.push({id:uid(),text,checked:false});
  inp.value='';
  renderEcl(stepId,step.items);
}

function toggleStep(hdr){
  const body=hdr.nextElementSibling;
  const icon=hdr.querySelector('.step-toggle');
  const open=body.classList.contains('open');
  body.classList.toggle('open',!open);
  icon.classList.toggle('open',!open);
}
function expandAll(){
  document.querySelectorAll('.step-body-wrap').forEach(b=>b.classList.add('open'));
  document.querySelectorAll('.step-toggle').forEach(i=>i.classList.add('open'));
}
function collapseAll(){
  document.querySelectorAll('.step-body-wrap').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.step-toggle').forEach(i=>i.classList.remove('open'));
}

// ─── Export ──────────────────────────────────────────────────────────────────
function dl(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();document.getElementById('EXPMSG').textContent=name+' 已下载 ✓';}
function expBudget(){
  const tb=S.budget.reduce((s,r)=>s+r.budget,0),tp=S.budget.reduce((s,r)=>s+r.paid,0);
  let c='分类,预算,已付,差额,状态\n';
  S.budget.forEach(r=>{const d=r.budget-r.paid;const st=r.paid>r.budget?'超支':r.paid>=r.budget?'完成':r.paid>0?'进行中':'未开始';c+=`${r.name},${r.budget},${r.paid},${d},${st}\n`;});
  c+=`合计,${tb},${tp},${tb-tp},\n`;
  dl('装修预算报表.csv','\uFEFF'+c,'text/csv');
}
function expPayment(){
  let c='付款事项,金额,截止日期,备注,状态\n';
  S.payments.forEach(r=>{const s=r.paid?'已付':days(r.dueDate)<0?'已逾期':'待付';c+=`${r.name},${r.amount},${r.dueDate},${r.note||''},${s}\n`;});
  dl('付款节点.csv','\uFEFF'+c,'text/csv');
}
function expProgress(){
  let c='施工项目,负责方,计划完成,状态,照片数\n';
  const sl={done:'已完成',progress:'进行中',pending:'待开始'};
  S.progress.forEach(r=>c+=`${r.name},${r.worker},${r.date},${sl[r.status]},${r.photos.length}\n`);
  dl('施工进度.csv','\uFEFF'+c,'text/csv');
}

  const slm={arrived:'已到货',transit:'运输中',ordered:'已下单',notyet:'未下单'};
  const h=`<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>装修管理报告</title>
<style>body{font-family:system-ui,'PingFang SC',sans-serif;max-width:820px;margin:40px auto;padding:0 24px;color:#1a1a1a;font-size:14px}
h1{font-size:22px;font-weight:700;margin-bottom:4px}.meta{color:#888;font-size:13px;margin-bottom:32px}
h2{font-size:16px;font-weight:600;margin:28px 0 10px;border-bottom:1px solid #eee;padding-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px}
th{text-align:left;padding:8px 10px;background:#f5f5f5;font-weight:500;font-size:12px}
td{padding:9px 10px;border-bottom:1px solid #eee}
.ok{color:#2d6a1f}.bad{color:#991f1f}.warn{color:#7a4500}.sum{font-weight:600;background:#f9f9f9}
.li{border-left:3px solid #ddd;padding:8px 12px;margin-bottom:10px;font-size:13px;line-height:1.6}
.lm{font-size:11px;color:#888;margin-top:3px}
</style></head><body>
<h1>悦望名邸装修管理报告</h1>
<div class="meta">生成时间：${new Date().toLocaleString('zh-CN')} · 五层排屋 162㎡ · 半包</div>
<h2>预算总览</h2><table><tr><th>分类</th><th>预算</th><th>已付</th><th>差额</th><th>状态</th></tr>
${S.budget.map(r=>{const d=r.budget-r.paid;const o=r.paid>r.budget;return`<tr><td>${r.name}</td><td>¥${r.budget.toLocaleString()}</td><td>¥${r.paid.toLocaleString()}</td><td class="${o?'bad':'ok'}">${o?'-':'+'}¥${Math.abs(d).toLocaleString()}</td><td class="${o?'bad':r.paid>=r.budget?'ok':'warn'}">${o?'超支':r.paid>=r.budget?'完成':r.paid>0?'进行中':'未开始'}</td></tr>`;}).join('')}
<tr class="sum"><td>合计</td><td>¥${tb.toLocaleString()}</td><td>¥${tp.toLocaleString()}</td><td class="${tp>tb?'bad':'ok'}">${tp>tb?'-':'+'}¥${Math.abs(tb-tp).toLocaleString()}</td><td></td></tr></table>
<h2>付款节点</h2><table><tr><th>事项</th><th>金额</th><th>截止日期</th><th>备注</th><th>状态</th></tr>
${S.payments.map(r=>{const d=days(r.dueDate);return`<tr><td>${r.name}</td><td>¥${r.amount.toLocaleString()}</td><td>${r.dueDate}</td><td>${r.note||''}</td><td class="${r.paid?'ok':d<0?'bad':'warn'}">${r.paid?'已付':d<0?'逾期':'待付'}</td></tr>`;}).join('')}</table>
<h2>施工进度</h2><table><tr><th>项目</th><th>负责方</th><th>计划完成</th><th>状态</th></tr>
${S.progress.map(r=>`<tr><td>${r.name}</td><td>${r.worker}</td><td>${r.date}</td><td class="${r.status==='done'?'ok':r.status==='progress'?'warn':''}">${slpg[r.status]}</td></tr>`).join('')}</table>
<h2>材料采购</h2><table><tr><th>材料</th><th>规格</th><th>数量</th><th>金额</th><th>状态</th></tr>
${S.materials.map(r=>`<tr><td>${r.name}</td><td>${r.spec}</td><td>${r.qty}</td><td>${r.price?'¥'+r.price.toLocaleString():'-'}</td><td>${slm[r.status]}</td></tr>`).join('')}</table>
<h2>沟通记录</h2>${[...S.logs].reverse().map(r=>`<div class="li">${r.text}<div class="lm">${r.who} · ${r.date}</div></div>`).join('')}

  dl('装修管理报告.html',h,'text/html');
}

// ─── Init ────────────────────────────────────────────────────────────────────
rAll();
buildGuide();
</script>
</body>
